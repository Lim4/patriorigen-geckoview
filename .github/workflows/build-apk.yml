name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare original app icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/src/main/assets/patriorigen-icon.png.b64 > app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Patriorigen-gecko-arm64-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.event_name == 'push' && github.event.head_commit.message == 'Correct release asset filename'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: Patriorigen-gecko-arm64-apk
          path: dist
      - name: Replace release APK asset with the requested filename
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/app-debug.apk Patriorigen-gecko.apk
          gh release upload v1.1.0 Patriorigen-gecko.apk --clobber
          if gh release view v1.1.0 --json assets --jq '.assets[].name' | grep -qx 'app-debug.apk'; then
            gh release delete-asset v1.1.0 app-debug.apk --yes
          fi
