name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare original app icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/src/main/assets/patriorigen-icon.png.b64 > app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.event.head_commit.message == 'Publish GitHub Release v1.1.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.1.0 app/build/outputs/apk/debug/app-debug.apk --title "Patriorigen-gecko v1.1.0" --notes "APK ARM64 con el icono original de Patriorigen. Requiere Android 8.0 o posterior."
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Patriorigen-gecko-arm64-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
