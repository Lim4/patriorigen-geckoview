plugins {
    id 'com.android.application'
}

android {
    namespace 'es.patriorigen.app'
    compileSdk 36

    defaultConfig {
        applicationId 'es.patriorigen.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:150.0.20260511200624'
}
